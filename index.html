<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choir Pitch Feedback</title>

  <script src="https://cdn.jsdelivr.net/npm/vexflow@5.0.0/build/cjs/vexflow-core.js"></script>

  <style>
    :root {
      --navy: #042f5f;
      --gold: #d1b43c;
      --green: #496450;
      --red: #88293a;
      --border: #c9d3dc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #333;
      font-family: Arial, sans-serif;
      line-height: 1.4;
    }

    main {
      width: min(1050px, 100%);
      margin: auto;
      padding: 16px;
    }

    h1,
    h2 {
      color: var(--navy);
      line-height: 1.15;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 1.1rem;
    }

    p {
      margin: 6px 0 8px;
    }

    .main-layout {
      display: grid;
      grid-template-columns: 210px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }

    .left-column {
      grid-column: 1;
    }

    .content-stack {
      grid-column: 2;
      min-width: 0;
    }

    .panel {
      padding: 14px;
      margin-bottom: 12px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 1px 4px #0000000d;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    button {
      width: 100%;
      min-height: 36px;
      padding: 8px 10px;
      border: 0;
      border-radius: 7px;
      color: #fff;
      font-size: 0.82rem;
      font-weight: bold;
      cursor: pointer;
    }

    button:focus {
      outline: 3px solid var(--gold);
      outline-offset: 2px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #startButton,
    #newMelodyButton {
      background: var(--navy);
    }

    #stopButton {
      background: var(--red);
    }

    #playMelodyButton,
    #startingPitchButton {
      background: var(--green);
    }

    .notation-stage {
      position: relative;
      width: 100%;
      height: 270px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #fff;
    }

    #notation {
      width: 100%;
      height: 260px;
      overflow: hidden;
    }

    .results-description {
      color: #555;
      font-size: 0.78rem;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(16, minmax(24px, 1fr));
      gap: 8px 5px;
      margin-top: 14px;
    }

    .result-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .result-box {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: 2px solid #b7c0c7;
      border-radius: 4px;
      background: #ffffff;
      color: transparent;
      font-size: 18px;
      font-weight: bold;
      line-height: 1;
    }

    .result-number {
      color: #555;
      font-size: 0.68rem;
      font-weight: bold;
    }

    .result-box.correct {
      border-color: var(--green);
      background: #edf5ef;
      color: var(--green);
    }

    .result-box.incorrect {
      border-color: var(--red);
      background: #fbecef;
      color: var(--red);
    }

    .tuner-panel {
      text-align: center;
    }

    .tuner {
      position: relative;
      width: 180px;
      height: 100px;
      margin: 8px auto 0;
      overflow: hidden;
    }

    .tuner-arc {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 175px;
      height: 88px;
      border-radius: 175px 175px 0 0;
      background:
        conic-gradient(
          from 270deg at 50% 100%,
          #88293a 0deg,
          #b77334 35deg,
          #d1b43c 55deg,
          #496450 82deg,
          #496450 98deg,
          #d1b43c 125deg,
          #b77334 145deg,
          #88293a 180deg
        );
      transform: translateX(-50%);
    }

    .tuner-needle {
      position: absolute;
      bottom: 6px;
      left: 50%;
      z-index: 2;
      width: 3px;
      height: 72px;
      border-radius: 4px;
      background: var(--navy);
      transform: translateX(-50%) rotate(0deg);
      transform-origin: 50% 100%;
      transition:
        transform 0.1s linear,
        background 0.1s linear;
    }

    .tuner-center {
      position: absolute;
      bottom: 2px;
      left: 50%;
      z-index: 3;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--navy);
      transform: translateX(-50%);
    }

    .tuner-labels {
      display: flex;
      justify-content: space-between;
      width: 175px;
      margin: 3px auto 0;
      color: #555;
      font-size: 0.68rem;
      font-weight: bold;
    }

    @media (max-width: 760px) {
      .main-layout {
        grid-template-columns: 1fr;
      }

      .left-column,
      .content-stack {
        grid-column: 1;
      }

      .left-column {
        order: 1;
      }

      .content-stack {
        order: 2;
      }

      .result-grid {
        grid-template-columns: repeat(8, minmax(24px, 1fr));
      }
    }

    @media (max-width: 560px) {
      .result-grid {
        grid-template-columns: repeat(8, minmax(22px, 1fr));
        gap: 8px 2px;
      }

      .result-box {
        width: 25px;
        height: 25px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Choir Pitch Feedback</h1>

    <p>
      Follow the written melody, listen to the reference tones, and receive feedback about pitch accuracy.
    </p>

    <div class="main-layout">
      <div class="left-column">
        <section class="panel">
          <h2>Controls</h2>

          <div class="controls">
            <button id="startButton">Start Microphone</button>
            <button id="stopButton" disabled>Stop</button>
            <button id="playMelodyButton">Play Melody</button>
            <button id="startingPitchButton">Starting Pitch</button>
            <button id="newMelodyButton">New Melody</button>
          </div>
        </section>

        <section class="panel tuner-panel">
          <h2>Pitch Tuner</h2>

          <div class="tuner" aria-label="Semicircular pitch tuner">
            <div class="tuner-arc"></div>
            <div id="tunerNeedle" class="tuner-needle" aria-hidden="true"></div>
            <div class="tuner-center" aria-hidden="true"></div>
          </div>

          <div class="tuner-labels" aria-hidden="true">
            <span>Flat</span>
            <span>Centered</span>
            <span>Sharp</span>
          </div>
        </section>
      </div>

      <div class="content-stack">
        <section class="panel">
          <h2>Sight-Reading Exercise</h2>

          <div class="notation-stage">
            <div id="notation" aria-label="Treble clef sight-reading exercise"></div>
          </div>
        </section>

        <section class="panel">
          <h2>Pitch Results</h2>

          <p class="results-description">
            Each numbered box corresponds to one pitch in the exercise.
          </p>

          <div id="resultGrid" class="result-grid"></div>
        </section>
      </div>
    </div>
  </main>

  <script>
    const VF = window.VexFlow;

    const PITCHES = [
      { key: "c/4", frequency: 261.63 },
      { key: "d/4", frequency: 293.66 },
      { key: "e/4", frequency: 329.63 },
      { key: "f/4", frequency: 349.23 },
      { key: "g/4", frequency: 392.00 },
      { key: "a/4", frequency: 440.00 },
      { key: "b/4", frequency: 493.88 },
      { key: "c/5", frequency: 523.25 },
      { key: "d/5", frequency: 587.33 },
      { key: "e/5", frequency: 659.25 }
    ];

    const TOTAL_NOTES = 32;
    const NOTES_PER_MEASURE = 4;
    const TOTAL_MEASURES = 8;
    const NOTE_TIME = 900;
    const COUNT_IN_TIME = 650;
    const ACCURACY_MARGIN = 30;

    let melody = [];
    let noteSamples = [];
    let noteResults = [];

    let running = false;
    let currentNote = 0;

    let audioContext = null;
    let analyser = null;
    let microphoneSource = null;
    let microphoneStream = null;

    let animationFrameId = null;
    let countInTimer = null;
    let noteTimer = null;
    let toneNodes = [];

    const startButton = document.getElementById("startButton");
    const stopButton = document.getElementById("stopButton");
    const playMelodyButton = document.getElementById("playMelodyButton");
    const startingPitchButton = document.getElementById("startingPitchButton");
    const newMelodyButton = document.getElementById("newMelodyButton");

    const resultGrid = document.getElementById("resultGrid");
    const tunerNeedle = document.getElementById("tunerNeedle");
    const notationContainer = document.getElementById("notation");

    startButton.onclick = startPractice;
    stopButton.onclick = () => stopPractice();
    playMelodyButton.onclick = playMelody;
    startingPitchButton.onclick = playStartingPitch;
    newMelodyButton.onclick = createNewMelody;

    window.addEventListener("resize", renderNotation);

    function generateMelody() {
      melody = [];

      let previousIndex = 0;

      for (let i = 0; i < TOTAL_NOTES; i++) {
        const possibleSteps = [-2, -1, 1, 2]
          .map(step => previousIndex + step)
          .filter(index => index >= 0 && index < PITCHES.length);

        if (i === 0) {
          previousIndex = 0;
        } else if (possibleSteps.length > 0) {
          previousIndex =
            possibleSteps[
              Math.floor(Math.random() * possibleSteps.length)
            ];
        }

        melody.push(PITCHES[previousIndex]);
      }
    }

    function createResultGrid() {
      resultGrid.innerHTML = "";

      for (let i = 0; i < TOTAL_NOTES; i++) {
        const item = document.createElement("div");
        item.className = "result-item";

        const box = document.createElement("div");
        box.className = "result-box";
        box.id = "result-" + i;

        const number = document.createElement("div");
        number.className = "result-number";
        number.textContent = i + 1;

        item.appendChild(box);
        item.appendChild(number);
        resultGrid.appendChild(item);
      }
    }

    function updateResultBox(index, result) {
      const box = document.getElementById("result-" + index);

      if (!box) return;

      box.classList.remove("correct", "incorrect");

      if (result === "correct") {
        box.classList.add("correct");
        box.textContent = "✓";
      }

      if (result === "incorrect") {
        box.classList.add("incorrect");
        box.textContent = "×";
      }
    }

    async function prepareNotation() {
      try {
        await VF.loadFonts("Bravura", "Academico");
        VF.setFonts("Bravura", "Academico");
        renderNotation();
      } catch (error) {
        console.error(error);
        notationContainer.textContent =
          "The music notation could not be loaded.";
      }
    }

    function renderNotation() {
      if (!melody.length) return;

      notationContainer.innerHTML = "";

      const width = Math.max(notationContainer.clientWidth, 720);

      const renderer = new VF.Renderer(
        notationContainer,
        VF.Renderer.Backends.SVG
      );

      renderer.resize(width, 260);

      const context = renderer.getContext();

      const leftMargin = 20;
      const rightMargin = 20;
      const headerWidth = 105;
      const measureStart = leftMargin + headerWidth;

      const measureWidth =
        (width - measureStart - rightMargin) / 4;

      for (let measure = 0; measure < TOTAL_MEASURES; measure++) {
        const row = Math.floor(measure / 4);
        const column = measure % 4;

        const x = measureStart + column * measureWidth;
        const y = 35 + row * 110;

        if (measure === 0) {
          new VF.Stave(
            leftMargin,
            y,
            headerWidth
          )
            .addClef("treble")
            .addTimeSignature("4/4")
            .setBegBarType(VF.BarlineType.NONE)
            .setEndBarType(VF.BarlineType.NONE)
            .setContext(context)
            .draw();
        }

        const stave = new VF.Stave(
          x,
          y,
          measureWidth
        );

        if (measure === TOTAL_MEASURES - 1) {
          stave.setEndBarType(VF.BarlineType.END);
        }

        stave.setContext(context).draw();

        const notesForMeasure = melody.slice(
          measure * NOTES_PER_MEASURE,
          measure * NOTES_PER_MEASURE + NOTES_PER_MEASURE
        );

        const notes = notesForMeasure.map((note, noteOffset) => {
          const index =
            measure * NOTES_PER_MEASURE + noteOffset;

          const stemDirection =
            ["b/4", "c/5", "d/5", "e/5"].includes(note.key)
              ? VF.Stem.DOWN
              : VF.Stem.UP;

          const staveNote = new VF.StaveNote({
            keys: [note.key],
            duration: "q"
          });

          staveNote.setStemDirection(stemDirection);

          let color = "#000000";

          if (index === currentNote && running) {
            color = "#d1b43c";
          } else if (noteResults[index] === "correct") {
            color = "#496450";
          } else if (noteResults[index] === "incorrect") {
            color = "#88293a";
          }

          staveNote.setStyle({
            fillStyle: color,
            strokeStyle: color
          });

          return staveNote;
        });

        const voice = new VF.Voice({
          numBeats: 4,
          beatValue: 4
        });

        voice.addTickables(notes);

        new VF.Formatter()
          .joinVoices([voice])
          .format([voice], measureWidth - 24);

        voice.draw(context, stave);
      }
    }

    function getToneContext() {
      if (!audioContext) {
        audioContext = new (
          window.AudioContext ||
          window.webkitAudioContext
        )();
      }

      return audioContext;
    }

    function stopAllTones() {
      toneNodes.forEach(node => {
        try {
          node.stop();
        } catch (error) {}
      });

      toneNodes = [];
    }

    function playFrequency(
      frequency,
      duration = 0.7,
      startTime = null
    ) {
      const context = getToneContext();
      const start = startTime || context.currentTime;

      const oscillator = context.createOscillator();
      const gain = context.createGain();

      oscillator.type = "triangle";
      oscillator.frequency.value = frequency;

      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(
        0.16,
        start + 0.03
      );
      gain.gain.exponentialRampToValueAtTime(
        0.0001,
        start + duration
      );

      oscillator.connect(gain);
      gain.connect(context.destination);

      oscillator.start(start);
      oscillator.stop(start + duration + 0.05);

      toneNodes.push(oscillator);
    }

    function playClick(accent = false) {
      const context = getToneContext();
      const start = context.currentTime;

      const oscillator = context.createOscillator();
      const gain = context.createGain();

      oscillator.type = "square";
      oscillator.frequency.value = accent ? 1000 : 700;

      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(
        accent ? 0.18 : 0.11,
        start + 0.005
      );
      gain.gain.exponentialRampToValueAtTime(
        0.0001,
        start + 0.08
      );

      oscillator.connect(gain);
      gain.connect(context.destination);

      oscillator.start(start);
      oscillator.stop(start + 0.1);
    }

    function playMelody() {
      stopAllTones();

      const context = getToneContext();
      context.resume();

      const start = context.currentTime + 0.05;

      melody.forEach((note, index) => {
        playFrequency(
          note.frequency,
          0.65,
          start + index * 0.78
        );
      });
    }

    function playStartingPitch() {
      stopAllTones();

      const context = getToneContext();
      context.resume();

      playFrequency(
        melody[0].frequency,
        0.9,
        context.currentTime + 0.05
      );
    }

    function updateTuner(cents) {
      const limited = Math.max(-100, Math.min(100, cents));
      const angle = limited * 0.45;

      tunerNeedle.style.transform =
        "translateX(-50%) rotate(" + angle + "deg)";

      tunerNeedle.style.background =
        Math.abs(cents) <= 20
          ? "#496450"
          : cents < 0
            ? "#b77334"
            : "#88293a";
    }

    function calculateCentsDifference(detected, target) {
      return 1200 * Math.log2(detected / target);
    }

    function autoCorrelate(buffer, sampleRate) {
      let rms = 0;

      for (let i = 0; i < buffer.length; i++) {
        rms += buffer[i] * buffer[i];
      }

      rms = Math.sqrt(rms / buffer.length);

      if (rms < 0.01) return -1;

      let bestOffset = -1;
      let bestCorrelation = 0;

      const minOffset = Math.floor(sampleRate / 1000);
      const maxOffset = Math.floor(sampleRate / 80);

      for (
        let offset = minOffset;
        offset <= maxOffset;
        offset++
      ) {
        let correlation = 0;

        for (let i = 0; i < buffer.length - offset; i++) {
          correlation += buffer[i] * buffer[i + offset];
        }

        correlation /= buffer.length - offset;

        if (correlation > bestCorrelation) {
          bestCorrelation = correlation;
          bestOffset = offset;
        }
      }

      if (bestOffset === -1 || bestCorrelation < 0.01) {
        return -1;
      }

      return sampleRate / bestOffset;
    }

    function addPitchSample(frequency, targetNote) {
      const cents = calculateCentsDifference(
        frequency,
        targetNote.frequency
      );

      updateTuner(cents);
      noteSamples.push(cents);
    }

    function finalizeCurrentNote() {
      if (!noteSamples.length) {
        noteResults[currentNote] = "incorrect";
        updateResultBox(currentNote, "incorrect");
        return;
      }

      const averageAbsoluteCents =
        noteSamples.reduce(
          (sum, value) => sum + Math.abs(value),
          0
        ) / noteSamples.length;

      const result =
        averageAbsoluteCents <= ACCURACY_MARGIN
          ? "correct"
          : "incorrect";

      noteResults[currentNote] = result;
      updateResultBox(currentNote, result);
    }

    async function prepareMicrophone() {
      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {
        throw new Error(
          "Microphone access is not supported."
        );
      }

      microphoneStream =
        await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            autoGainControl: false,
            noiseSuppression: false
          }
        });

      audioContext = new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

      await audioContext.resume();

      analyser = audioContext.createAnalyser();
      analyser.fftSize = 4096;
      analyser.smoothingTimeConstant = 0.2;

      microphoneSource =
        audioContext.createMediaStreamSource(
          microphoneStream
        );

      microphoneSource.connect(analyser);
    }

    function beginMicrophoneLoop() {
      if (!analyser) return;

      const buffer = new Float32Array(
        analyser.fftSize
      );

      const analyze = () => {
        if (!running || !analyser) return;

        analyser.getFloatTimeDomainData(buffer);

        const frequency = autoCorrelate(
          buffer,
          audioContext.sampleRate
        );

        if (frequency >= 70 && frequency <= 1000) {
          addPitchSample(
            frequency,
            melody[currentNote]
          );
        }

        animationFrameId =
          requestAnimationFrame(analyze);
      };

      analyze();
    }

    function startPractice() {
      if (running) return;

      running = true;
      currentNote = 0;
      noteSamples = [];
      noteResults = [];

      createResultGrid();
      renderNotation();

      startButton.disabled = true;
      stopButton.disabled = false;

      prepareMicrophone()
        .then(() => {
          if (!running) return;

          const context = getToneContext();
          context.resume();

          playFrequency(
            melody[0].frequency,
            0.9,
            context.currentTime + 0.05
          );

          setTimeout(() => {
            if (!running) return;

            let beat = 0;

            const countInBeat = () => {
              beat++;
              playClick(beat === 1);

              if (beat >= 4) {
                clearInterval(countInTimer);
                countInTimer = null;

                setTimeout(() => {
                  if (!running) return;

                  beginMicrophoneLoop();

                  noteTimer = setInterval(() => {
                    finalizeCurrentNote();

                    currentNote++;

                    if (currentNote >= TOTAL_NOTES) {
                      finishPractice();
                      return;
                    }

                    noteSamples = [];
                    renderNotation();
                  }, NOTE_TIME);
                }, 150);
              }
            };

            countInBeat();

            countInTimer = setInterval(
              countInBeat,
              COUNT_IN_TIME
            );
          }, 1100);
        })
        .catch(error => {
          console.error(error);
          stopPractice();
        });
    }

    function finishPractice() {
      if (!running) return;

      finalizeCurrentNote();
      stopPractice();

      currentNote = TOTAL_NOTES;
      renderNotation();
      updateTuner(0);
    }

    function stopPractice() {
      running = false;

      if (countInTimer) {
        clearInterval(countInTimer);
        countInTimer = null;
      }

      if (noteTimer) {
        clearInterval(noteTimer);
        noteTimer = null;
      }

      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }

      stopAllTones();

      if (microphoneStream) {
        microphoneStream
          .getTracks()
          .forEach(track => track.stop());

        microphoneStream = null;
      }

      if (microphoneSource) {
        microphoneSource.disconnect();
        microphoneSource = null;
      }

      if (audioContext) {
        audioContext.close();
        audioContext = null;
      }

      analyser = null;

      startButton.disabled = false;
      stopButton.disabled = true;
    }

    function createNewMelody() {
      stopPractice();

      generateMelody();
      currentNote = 0;
      noteSamples = [];
      noteResults = [];

      createResultGrid();
      renderNotation();
      updateTuner(0);
    }

    generateMelody();
    createResultGrid();
    prepareNotation();
  </script>
</body>
</html>
